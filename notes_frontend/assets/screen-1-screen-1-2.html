<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Screen 1 - 1:2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./design-system.css" />
  <link rel="stylesheet" href="./screen-1-screen-1-2.css" />
</head>
<body>
  <div class="screen screen-1" role="main" aria-label="Screen 1">
    <!-- Wall Polygon (VECTOR) -->
    <img
      class="node node-1-5 wall-polygon"
      src="/assets/figmaimages/figma_image_1_5.png"
      alt="Decorative polygon background"
    />

    <!-- Illustration (RECTANGLE with image fill) -->
    <img
      class="node node-1-3 illustration"
      src="/assets/figmaimages/figma_image_1_3.png"
      alt="Illustration"
    />

    <!-- Heading Text -->
    <div class="node node-3-2 heading" role="heading" aria-level="1">
      Create free notes &amp; collaborate with your team
    </div>

    <!-- Subheading Text -->
    <div class="node node-3-26 subheading">
      Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean est elit, lobortis a mattis vel, aliquet ut ligula.
    </div>

    <!-- Get Started Button Group -->
    <button class="node node-5-38 get-started-btn" type="button" aria-label="Get Started">
      <div class="btn-bg"></div>
      <div class="btn-content">
        <span class="btn-text">Get Started</span>
        <img class="btn-icon" src="/assets/figmaimages/figma_image_5_36.png" alt="" aria-hidden="true" />
      </div>
    </button>
  </div>

  <script src="./app.js"></script>
</body>
</html>
